# Internship Radar company list.
#
# tier = "S"  -> instant phone push + its own email for EVERY matching role (SWE included)
# tier = "A"  -> logged with a fit score for the daily Radar digest
# not listed  -> Tier B, logged only if it passes the filters
#
# names = how the company shows up in the Simplify / vanshb03 trackers
#         (case-insensitive prefix match). Used for companies without a direct source.
#
# Direct sources (checked every run, usually hours ahead of the trackers):
#   greenhouse = "<board token>"      lever = "<company>"      ashby = "<org>"
#   workday    = ["<tenant>", "<wdN>", "<Site>"]
#   eightfold  = ["<host>", "<domain>"]
#   amazon     = true
#
# To add a company: copy a block, set name + tier, add names and a direct source if it has one.

[alerts]
tiers = ["S"]
max_per_run = 8

[trackers]
simplify = "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"
vanshb03 = "https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json"


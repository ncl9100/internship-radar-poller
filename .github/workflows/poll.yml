name: Internship Radar poller

on:
  schedule:
    # GitHub cron is UTC. Times below are for Eastern Standard Time.
    # Every 10 min from 7am to midnight ET, every 30 min overnight.
    # Public repo, so Actions minutes are free and unlimited.
    # (GitHub may delay scheduled runs a few minutes under load.)
    - cron: "*/10 0-4,12-23 * * *"
    - cron: "*/30 5-11 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test Tier S push + email"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "poller.py"
      - "companies.toml"
      - ".github/workflows/poll.yml"
      - ".test-alert"

permissions:
  contents: write

concurrency:
  group: radar-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Poll job boards
        run: |
          if [ -f .test-alert ] || [ "${{ inputs.test_alert }}" = "true" ]; then export TEST_ALERT=1; fi
          python3 poller.py
          rm -f .test-alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Save state
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data .test-alert 2>/dev/null || git add -A data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "radar: state update"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1

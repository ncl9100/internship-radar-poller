name: Internship Radar poller

on:
  schedule:
    # Watchdog only. GitHub's cron is best-effort and can skip runs for hours,
    # so each run polls in a loop for ~5.5 hours and queues the next run itself.
    # This cron just restarts the chain if it ever breaks.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert (push + email)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "poller.py"
      - "companies.toml"
      - ".github/workflows/poll.yml"
      - ".github/loop.sh"
      - ".test-alert"

permissions:
  contents: write
  actions: write

# One loop at a time. A newly queued run waits for the current loop to finish
# (only the newest queued run is kept), which is what keeps the chain going.
concurrency:
  group: radar-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Queue the next loop (keeps polling going even if this run dies)
        run: gh workflow run poll.yml --ref main || echo "could not queue next run"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Poll every 10 minutes (30 overnight) for ~5.5 hours
        run: .github/loop.sh
        env:
          TEST_INPUT: ${{ inputs.test_alert }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Queue the next loop again (in case the first one was dropped)
        if: always()
        run: gh workflow run poll.yml --ref main || true
        env:
          GH_TOKEN: ${{ github.token }}

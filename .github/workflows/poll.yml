name: Internship Radar poller

on:
  schedule:
    # GitHub cron is UTC. Times below are for Eastern Standard Time.
    # Every 15 min from 7am to midnight ET, then hourly overnight.
    # About 75 runs a day, roughly 2,300 Actions minutes a month,
    # which fits GitHub Pro's 3,000 minutes for private repos.
    - cron: "*/15 0-4,12-23 * * *"
    - cron: "0 5-11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "poller.py"
      - "companies.toml"
      - ".github/workflows/poll.yml"

permissions:
  contents: write

concurrency:
  group: radar-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Poll job boards
        run: python3 poller.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Save state
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "radar: state update"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
